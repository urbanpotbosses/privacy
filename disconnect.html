<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DS Dashboard — Disconnected</title>
<style>
  :root {
    --color-bg: #f4f6fb;
    --color-surface: #ffffff;
    --color-border: #e5e9f0;
    --color-text: #1b2230;
    --color-muted: #6b7482;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--color-bg);
    color: var(--color-text);
    line-height: 1.6;
  }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 2.5rem 1.5rem 4rem;
  }
  .card {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: 12px;
    padding: 2rem;
    text-align: center;
  }
  h1 { font-size: 1.4rem; margin-top: 0; }
  p { color: var(--color-text); }
  .meta { color: var(--color-muted); font-size: 0.9rem; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>DS Dashboard</h1>
    <p>Your QuickBooks Online connection has been disconnected.</p>
    <p class="meta">You can safely close this window. To reconnect, use the connect option in your DS Dashboard application.</p>
  </div>
</div>
</body>
</html>
